services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: car_ad_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: '${UID:-1000}'
        GID: '${GID:-1000}'
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_DSN: pgsql:host=postgres;port=5432;dbname=car_ad_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      YII_ENV: dev
    ports:
      - '8080:8080'
    volumes:
      - ./controllers:/app/controllers:ro
      - ./services:/app/services:ro
      - ./repositories:/app/repositories:ro
      - ./entities:/app/entities:ro
      - ./models:/app/models:ro
      - ./validation:/app/validation:ro
      - ./mappers:/app/mappers:ro
      - ./exceptions:/app/exceptions:ro
      - ./config:/app/config:ro
      - ./web:/app/web:ro
      - ./router.php:/app/router.php:ro
      - ./yii:/app/yii:ro
      - ./phpunit.xml:/app/phpunit.xml:ro

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:80/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data: